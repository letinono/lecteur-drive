<!doctype html>
<html lang="fr" data-theme="winamp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lecteur Drive</title>
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lecteur">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem("ld.theme"));if(t==="winamp"||t==="apple")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="app">
    <div id="banner" role="alert"></div>
    <main id="view"></main>
  </div>
  <div id="mini"></div>
  <section id="sheet" hidden aria-label="Lecteur"></section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
